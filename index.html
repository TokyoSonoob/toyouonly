<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7f4">
<title>Good Morning</title>
<style>
:root {
  --ink: #59434f;
  --muted: #9b7e8c;
  --pink: #e985a7;
  --pink-dark: #cf648b;
  --pink-pale: #fff0f5;
  --line: #f0dce3;
  --paper: #fffdfc;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 22px 14px;
  color: var(--ink);
  font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  background: #fff7f4;
}
button, input { font: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.icon { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
.icon svg { display: block; width: 1em; height: 1em; fill: currentColor; }
.page { width: min(100%, 440px); }
.paper {
  position: relative;
  padding: 25px clamp(19px, 5vw, 31px) 28px;
  border: 1px solid #f3e6e9;
  border-radius: 23px;
  background: var(--paper);
  box-shadow: 0 12px 35px rgba(113, 73, 91, .08);
}
.paper::after {
  content: "";
  position: absolute;
  left: 18px; right: 18px; top: 9px;
  height: 1px;
  background: #fff;
}
.step { display: none; animation: step-in .35s ease both; }
.step.active { display: block; }
@keyframes step-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.step-label {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 0 0 15px;
  color: #bd8a9e;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.8px;
}
.step-label::before, .step-label::after {
  content: "";
  width: 25px;
  height: 1px;
  background: #e9cbd6;
}
.gif-wrap {
  width: min(100%, 280px);
  min-height: 120px;
  height: auto;
  display: grid;
  place-items: center;
  margin: 0 auto 15px;
  overflow: visible;
  border-radius: 17px;
  background: transparent;
}
.gif-wrap img {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: min(42vh, 320px);
  object-fit: contain;
  border-radius: 12px;
}
h1, h2 {
  margin: 0;
  color: #6b4b5a;
  text-align: center;
  line-height: 1.45;
}
h1 { font-size: clamp(29px, 7vw, 36px); }
h2 { font-size: clamp(21px, 5.5vw, 25px); }
.subtext {
  margin: 8px 0 22px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
  line-height: 1.8;
}
.progress {
  width: 100%;
  height: 4px;
  margin: 0 0 20px;
  overflow: hidden;
  border-radius: 20px;
  background: #f5e8ec;
}
.progress span {
  display: block;
  width: 50%;
  height: 100%;
  border-radius: inherit;
  background: #e9a1b8;
  transition: width .3s ease;
}
.primary {
  width: 100%;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 11px 18px;
  border: 0;
  border-radius: 13px;
  color: white;
  background: #e98aa9;
  box-shadow: 0 5px 0 #d87899;
  font-size: 14px;
  font-weight: 800;
  transition: transform .15s ease, box-shadow .15s ease;
}
.primary:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #d87899; }
.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #d87899; }
.name-form { display: grid; gap: 10px; }
.name-input {
  width: 100%;
  height: 49px;
  padding: 0 14px;
  border: 1px solid #ead5dd;
  border-radius: 12px;
  outline: none;
  color: var(--ink);
  background: #fff;
  text-align: center;
  font-size: 15px;
}
.name-input::placeholder { color: #c2aab4; }
.name-input:focus { border-color: #df8da9; box-shadow: 0 0 0 3px #e98aa91f; }
.feedback {
  display: none;
  margin-top: 14px;
  padding: 14px 13px;
  border: 1px solid #f0dce3;
  border-radius: 13px;
  background: #fff6f8;
  text-align: center;
  animation: step-in .25s ease both;
}
.feedback.show { display: block; }
.feedback p { margin: 0; color: #a95579; font-size: 14px; font-weight: 800; line-height: 1.7; }
.feedback small { display: block; margin-top: 4px; color: #a78a97; font-size: 11px; }
.chat-options { display: none; gap: 7px; margin-top: 11px; }
.chat-options.show { display: grid; }
.choice {
  min-height: 38px;
  padding: 8px 12px;
  border: 1px solid #efdce3;
  border-radius: 11px;
  color: #8c6175;
  background: #fff;
  text-align: left;
  font-size: 12px;
  font-weight: 700;
}
.choice:hover { background: #fff2f6; }
.attempt { min-height: 14px; margin-top: 9px; color: #b59aa6; text-align: center; font-size: 10px; }
button:focus-visible, input:focus-visible { outline: 3px solid #e98aa955; outline-offset: 3px; }

.surprise {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  place-items: center;
  overflow: hidden;
  padding: 20px;
  background: #ffdbe7;
}
.surprise.active { display: grid; animation: full-pop .7s cubic-bezier(.16,.85,.25,1) both; }
@keyframes full-pop {
  0% { opacity: 0; transform: scale(.94); }
  65% { opacity: 1; transform: scale(1.025); }
  100% { opacity: 1; transform: scale(1); }
}
.surprise-bg {
  position: absolute;
  inset: -45%;
  pointer-events: none;
  background: repeating-conic-gradient(from 0deg, #ffffff4d 0deg 7deg, transparent 7deg 14deg);
  animation: rotate-bg 30s linear infinite;
}
@keyframes rotate-bg { to { transform: rotate(360deg); } }
.surprise-card {
  position: relative;
  z-index: 1;
  width: min(100%, 540px);
  padding: 24px 20px 26px;
  border: 2px solid #fff;
  border-radius: 25px;
  background: rgba(255, 251, 251, .94);
  box-shadow: 0 20px 65px rgba(139, 67, 98, .17);
  text-align: center;
  animation: card-bounce .75s .12s cubic-bezier(.2,.9,.25,1.2) both;
}
@keyframes card-bounce {
  0% { opacity: 0; transform: translateY(35px) scale(.78) rotate(-3deg); }
  70% { opacity: 1; transform: translateY(-5px) scale(1.04) rotate(1deg); }
  100% { opacity: 1; transform: none; }
}
.surprise .gif-wrap {
  width: min(100%, 320px);
  min-height: 120px;
  height: auto;
  margin-bottom: 14px;
  background: transparent;
}
.surprise .gif-wrap img { max-height: min(36vh, 280px); }
.kicker {
  margin: 0 0 8px;
  color: #d47798;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 2px;
}
.surprise h2 { font-size: clamp(24px, 6vw, 34px); }
.surprise-line {
  margin: 8px 0 18px;
  color: #a25e7a;
  font-size: 17px;
  font-weight: 800;
}
.surprise-actions { display: grid; gap: 8px; }
.secondary {
  min-height: 42px;
  padding: 9px 16px;
  border: 1px solid #efd8e1;
  border-radius: 12px;
  color: #9b6680;
  background: white;
  font-size: 13px;
  font-weight: 800;
}
.final-screen { display: none; }
.final-screen.active { display: block; animation: step-in .45s ease both; }
.surprise-card.first-screen.hidden { display: none; }
.confetti {
  position: absolute;
  top: -12vh;
  left: var(--left);
  width: var(--size);
  height: calc(var(--size) * 1.5);
  border-radius: 3px;
  background: var(--color);
  animation: confetti-fall var(--duration) linear var(--delay) infinite;
}
@keyframes confetti-fall {
  0% { transform: translateY(-10vh) rotate(0); opacity: 0; }
  12% { opacity: .9; }
  100% { transform: translate(var(--sway), 120vh) rotate(680deg); opacity: 0; }
}
@media(max-width:380px) {
  .paper { padding: 22px 16px 24px; }
  .gif-wrap { min-height: 105px; width: min(100%, 235px); }
  .gif-wrap img { max-height: min(38vh, 250px); }
  .surprise .gif-wrap img { max-height: min(34vh, 230px); }
  .surprise-card { padding: 19px 15px 21px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>
<div class="page">
  <main class="paper">
    <section class="step active" id="stepWelcome">
      <div class="step-label">STEP 01 · GOOD MORNING</div>
      <div class="gif-wrap">
        <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExNzZwOWtoNWR0YXYzazFqZmhueXE2ejYxaXppYjdqOHo3YXhzOGY4MSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/t6Lgcn2hVB8OlcGeqs/giphy.gif" alt="GIF ทักทายตอนเช้า" loading="eager" onerror="this.style.display='none'">
      </div>
      <h1>ตื่นละยางงง?</h1>
      <p class="subtext">ลุกได้แล้วมั้งงง มีเรื่องจะถาม</p>
      <button class="primary" id="wakeButton" type="button">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1Zm0 16a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1ZM4.22 4.22a1 1 0 0 1 1.42 0l1.41 1.41a1 1 0 0 1-1.41 1.42L4.22 5.64a1 1 0 0 1 0-1.42Zm11.32 11.32a1 1 0 0 1 1.41 0l1.42 1.41a1 1 0 0 1-1.42 1.42l-1.41-1.42a1 1 0 0 1 0-1.41ZM2 12a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1Zm16 0a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2h-2a1 1 0 0 1-1-1ZM4.22 19.78a1 1 0 0 1 0-1.42l1.41-1.41a1 1 0 0 1 1.42 1.41l-1.42 1.42a1 1 0 0 1-1.41 0Zm12.73-12.73a1 1 0 0 1 0-1.42l1.41-1.41a1 1 0 0 1 1.42 1.41l-1.42 1.42a1 1 0 0 1-1.41 0ZM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg></span>
        ตื่นแล้ว
      </button>
    </section>

    <section class="step" id="stepName">
      <div class="step-label">STEP 02 · เช็กคนตื่น</div>
      <div class="progress"><span></span></div>
      <div class="gif-wrap">
        <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExanZ1M2JmZXQzejFpM2V5dnJxeXo2Njlid2N0MXZyem9nYzhkb3ZkbCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/zINs6k7lwfawSbLOIc/giphy.gif" alt="GIF ทำหน้าสงสัย" loading="lazy" onerror="this.style.display='none'">
      </div>
      <h2>ตื่นจริง ๆ แล้วเหรอ?</h2>
      <p class="subtext">ไหนลองเขียนชื่อเราลงไปหน่อย</p>

      <form class="name-form" id="nameForm" novalidate>
        <input class="name-input" id="nameInput" type="text" maxlength="60" placeholder="พิมพ์ชื่อที่คิดว่าใช่..." autocomplete="off" aria-label="พิมพ์ชื่อ">
        <button class="primary" id="submitButton" type="button">ส่งคำตอบ</button>
      </form>

      <div class="feedback" id="feedback" aria-live="polite">
        <p id="feedbackText"></p>
        <small id="feedbackHint"></small>
      </div>

      <div class="chat-options" id="chatOptions">
        <button class="choice" type="button" data-chat="sleepy">ยังง่วงอยู่เลย</button>
        <button class="choice" type="button" data-chat="five">ขออีก 5 นาที</button>
        <button class="choice" type="button" data-chat="awake">ตื่นแล้วจริง ๆ นะ</button>
      </div>
      <div class="attempt" id="attemptCount"></div>
    </section>
  </main>
</div>

<section class="surprise" id="surprise" aria-live="polite">
  <div class="surprise-bg"></div>
  <div class="surprise-card first-screen" id="firstSurprise">
    <div class="kicker">เซอร์ไพรส์!</div>
    <div class="gif-wrap">
      <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExNGpnOTNkN3JmNjVqMmxvaTJ4eWxqbXNtMjI3cDZxNWsyZWpzeGF6NiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/86tg4sW36uCNrGJyJu/giphy.gif" alt="GIF เซอร์ไพรส์" loading="eager" onerror="this.style.display='none'">
    </div>
    <h2>ไม่ใช่! เราไม่ได้ชื่อ ซี</h2>
    <p class="surprise-line">ชื่อที่รักต่างหาก แบร่</p>
    <div class="surprise-actions">
      <button class="primary" id="nextSurprise" type="button">อ้าว ยังมีอีก</button>
    </div>
  </div>

  <div class="surprise-card final-screen" id="finalScreen">
    <div class="kicker">จบภารกิจคนตื่นแล้ว</div>
    <div class="gif-wrap">
      <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExNzZwOWtoNWR0YXYzazFqZmhueXE2ejYxaXppYjdqOHo3YXhzOGY4MSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/t6Lgcn2hVB8OlcGeqs/giphy.gif" alt="GIF ส่งกำลังใจ" loading="lazy" onerror="this.style.display='none'">
    </div>
    <h2>เชื่อแล้วว่าตื่นแล้ว</h2>
    <p class="surprise-line">ขอให้วันนี้เป็นวันที่ดีนะ</p>
    <button class="secondary" id="replayButton" type="button">เล่นใหม่อีกครั้ง</button>
  </div>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stepWelcome = $("stepWelcome");
  const stepName = $("stepName");
  const nameInput = $("nameInput");
  const feedback = $("feedback");
  const chatOptions = $("chatOptions");
  const surprise = $("surprise");
  const firstSurprise = $("firstSurprise");
  const finalScreen = $("finalScreen");

  let attempts = 0;
  let wrongBag = [];
  let chatRound = 0;
  let sending = false;

  const wrongReplies = [
    "อ้าวว ชื่อนี้ใครอะ เราถามชื่อเราอยู่น้า",
    "มั่นใจมากเลยนะ แต่คำตอบยังไม่ผ่านจ้า ลองใหม่อีกที",
    "คุยเยอะนะเราอะ ถามชื่อแค่นี้ยังตอบไม่ตรงเลย",
    "เอ๊ะ หรือว่ายังง่วงจนจำอะไรไม่ได้แล้วเนี่ย",
    "ชื่อนี้ฟังดูดีนะ แต่ไม่ใช่ชื่อที่เรารออยู่",
    "โอ้โห เดาเก่งมาก แต่ยังไม่ใช่น้า",
    "ขอปฏิเสธคำตอบนี้อย่างสุภาพ ลองใหม่อีกทีนะ",
    "ตื่นแล้วจริงหรือยังละเมอพิมพ์อยู่กันแน่",
    "ใกล้แล้วมั้ง... ล้อเล่น ยังไม่ใกล้เลย",
    "เราจะรอคำตอบที่ถูกต้องนะ แต่อย่านาน!"
  ];

  const chatReplies = {
    sleepy: [
      "งั้นค่อย ๆ ลุกก็ได้ แต่ห้ามหลับต่อแล้วนะ",
      "ไปล้างหน้าก่อนหนึ่งกรุบ แล้วค่อยกลับมาคุยกัน",
      "ขนาดพิมพ์ว่ายังง่วง ยังพิมพ์เก่งขนาดนี้เลยนะ",
      "ส่งพลังให้หนึ่งก้อน ฮึบ! ตื่นได้แล้ว",
      "ง่วงได้ แต่อย่าลืมยิ้มให้ตัวเองด้วยนะ"
    ],
    five: [
      "ห้านาทีของเธอนี่นานเป็นชั่วโมงเลยหรือเปล่า",
      "ต่อรองเก่งจริง ๆ ขออีกห้านาทีทุกเช้าเลยนะ",
      "ได้... แต่เราจะเริ่มนับถอยหลังแล้วนะ",
      "ห้านาทีสุดท้ายจริง ๆ นะ สัญญาก่อน",
      "ถ้าครบห้านาทีแล้วต้องกลับมาตอบคำถามด้วย"
    ],
    awake: [
      "พูดเก่งแบบนี้ต้องพิสูจน์ด้วยคำตอบแล้วล่ะ",
      "โอเค เราเริ่มเชื่อขึ้นมานิดนึงแล้วนะ นิดเดียว",
      "งั้นตอบดี ๆ อีกครั้ง เรารอฟังอยู่",
      "ตื่นแล้วก็ต้องมีสติสิ ลองคิดอีกทีนะ",
      "รับทราบ แต่คำตอบเมื่อกี้ยังไม่ถูกใจเราเลย"
    ]
  };

  function showFeedback(message, hint = "") {
    $("feedbackText").textContent = message;
    $("feedbackHint").textContent = hint;
    feedback.classList.remove("show");
    void feedback.offsetWidth;
    feedback.classList.add("show");
  }

  function nextWrongReply() {
    if (wrongBag.length === 0) {
      wrongBag = [...wrongReplies];
      for (let i = wrongBag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [wrongBag[i], wrongBag[j]] = [wrongBag[j], wrongBag[i]];
      }
    }
    return wrongBag.pop();
  }

  function addConfetti() {
    surprise.querySelectorAll(".confetti").forEach(el => el.remove());
    const colors = ["#fff", "#ff6f9f", "#ffd66e", "#b7a5ff", "#ff9fcb", "#9de4d1"];
    for (let i = 0; i < 65; i++) {
      const piece = document.createElement("i");
      piece.className = "confetti";
      piece.style.setProperty("--left", Math.random() * 100 + "%");
      piece.style.setProperty("--size", 5 + Math.random() * 8 + "px");
      piece.style.setProperty("--color", colors[Math.floor(Math.random() * colors.length)]);
      piece.style.setProperty("--duration", 3.5 + Math.random() * 4.5 + "s");
      piece.style.setProperty("--delay", Math.random() * 2.5 + "s");
      piece.style.setProperty("--sway", -90 + Math.random() * 180 + "px");
      surprise.appendChild(piece);
    }
  }

  function processAnswer() {
    if (sending) return;
    sending = true;

    const answer = nameInput.value.trim();

    if (!answer) {
      showFeedback("ยังไม่ได้เขียนอะไรเลยน้า", "ลองพิมพ์ชื่อก่อนสิ");
      nameInput.focus();
      sending = false;
      return;
    }

    if (answer.includes("ซี")) {
      firstSurprise.classList.remove("hidden");
      firstSurprise.style.display = "block";
      finalScreen.classList.remove("active");
      surprise.classList.add("active");
      document.body.style.overflow = "hidden";
      addConfetti();
      sending = false;
      return;
    }

    attempts += 1;
    showFeedback(nextWrongReply(), "ลองตอบใหม่อีกครั้งสิ");
    chatOptions.classList.add("show");
    $("attemptCount").textContent = `ลองผิดไปแล้ว ${attempts} ครั้ง`;
    nameInput.select();
    sending = false;
  }

  $("wakeButton").addEventListener("click", () => {
    stepWelcome.classList.remove("active");
    stepName.classList.add("active");
    setTimeout(() => nameInput.focus(), 180);
  });

  // The button has its own click handler, while Enter is handled by form submit.
  $("submitButton").addEventListener("click", processAnswer);
  $("nameForm").addEventListener("submit", event => {
    event.preventDefault();
    processAnswer();
  });
  nameInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      processAnswer();
    }
  });

  document.querySelectorAll("[data-chat]").forEach(button => {
    button.addEventListener("click", () => {
      const replies = chatReplies[button.dataset.chat];
      const reply = replies[chatRound % replies.length];
      chatRound += 1;
      showFeedback(reply, "แล้วชื่อเราล่ะ ลองตอบอีกทีสิ");
    });
  });

  $("nextSurprise").addEventListener("click", () => {
    firstSurprise.style.display = "none";
    finalScreen.classList.remove("active");
    void finalScreen.offsetWidth;
    finalScreen.classList.add("active");
  });

  $("replayButton").addEventListener("click", () => {
    attempts = 0;
    wrongBag = [];
    chatRound = 0;
    sending = false;
    nameInput.value = "";
    feedback.classList.remove("show");
    chatOptions.classList.remove("show");
    $("attemptCount").textContent = "";
    surprise.classList.remove("active");
    firstSurprise.style.display = "block";
    document.body.style.overflow = "";
    stepName.classList.remove("active");
    stepWelcome.classList.add("active");
  });
})();
</script>
</body>
</html>
